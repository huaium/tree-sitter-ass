[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-ass"
description = "A tree-sitter parser for ass/ssa subtitles"
version = "0.1.1"
keywords = ["incremental", "parsing", "tree-sitter", "ass", "ssa"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "huaium", email = "adamzhangme@gmail.com" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/huaium/tree-sitter-ass"

[project.optional-dependencies]
core = ["tree-sitter>=0.26,<0.27"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
