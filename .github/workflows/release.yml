name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH")
          version = tag[1:]
          for filename in ("package.json", "tree-sitter.json"):
              data = json.loads(Path(filename).read_text())
              actual = data["version"] if filename == "package.json" else data["metadata"]["version"]
              if actual != version:
                  raise SystemExit(f"{filename}: {actual} does not match {tag}")
          for filename, section in (("Cargo.toml", "package"), ("pyproject.toml", "project")):
              actual = tomllib.loads(Path(filename).read_text())[section]["version"]
              if actual != version:
                  raise SystemExit(f"{filename}: {actual} does not match {tag}")
      - name: Build source packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          cargo package --locked
          cp target/package/*.crate dist/
          uv build --sdist
          git archive --format=tar.gz --prefix="tree-sitter-ass-${RELEASE_TAG}/" --output="dist/tree-sitter-ass-${RELEASE_TAG}-source.tar.gz" HEAD
          cp queries/highlights.scm dist/highlights.scm
      - uses: actions/upload-artifact@v4
        with:
          name: source-packages
          path: dist/*
          if-no-files-found: error

  wheels:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Build and test wheels
        run: uvx cibuildwheel==3.2.1 --output-dir dist
        env:
          CIBW_ARCHS: auto64
          CIBW_TEST_REQUIRES: tree-sitter>=0.26,<0.27
          CIBW_TEST_COMMAND: python -m unittest discover -s "{project}/bindings/python/tests" -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: [packages, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG" ./*
          gh release edit "$RELEASE_TAG" --draft=false
